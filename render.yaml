# Render reads this when you connect the repo. Blueprint -> New Blueprint Instance.
services:
  - type: web
    name: north-hall-bbq
    runtime: docker
    plan: starter                 # $7/mo. NOT free -- the free tier has no disk.
    region: ohio                  # closest of Render's US regions to Georgia
    healthCheckPath: /api/config
    autoDeployTrigger: commit     # every push to main redeploys
    envVars:
      - key: BASE_URL
        value: https://northhallbbq.com
      - key: DATA_DIR
        value: /data
      - key: ADMIN_PASSWORD
        sync: false               # set in the dashboard -- never in the repo
    disks:
      - name: bbq-data
        mountPath: /data          # bbq.db lives here and survives deploys
        sizeGB: 1
